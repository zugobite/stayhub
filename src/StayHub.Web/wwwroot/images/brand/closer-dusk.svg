<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax meet"
     role="img" aria-label="The coastal village at dusk, windows lit along the waterfront">
  <title>The waterfront at dusk</title>
  <defs>
    <linearGradient id="cdWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14608f"/>
      <stop offset="1" stop-color="#0a3352" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="cdMoon">
      <stop offset="0" stop-color="#f6b31b" stop-opacity=".5"/>
      <stop offset="70%" stop-color="#f6b31b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- No background: the band's own gradient and glows show through. -->

  <circle cx="1010" cy="52" r="60" fill="url(#cdMoon)"/>
  <circle cx="1010" cy="52" r="24" fill="#f6b31b"/>

  <g fill="#ffffff">
    <circle cx="92" cy="34" r="2.1" opacity=".8"/>
    <circle cx="214" cy="18" r="1.5" opacity=".55"/>
    <circle cx="330" cy="44" r="1.9" opacity=".7"/>
    <circle cx="470" cy="24" r="1.4" opacity=".5"/>
    <circle cx="606" cy="40" r="2" opacity=".65"/>
    <circle cx="742" cy="20" r="1.5" opacity=".5"/>
    <circle cx="860" cy="46" r="1.8" opacity=".6"/>
    <circle cx="1128" cy="30" r="1.6" opacity=".55"/>
    <circle cx="160" cy="72" r="1.4" opacity=".45"/>
    <circle cx="920" cy="90" r="1.4" opacity=".4"/>
  </g>

  <!-- waterfront -->
  <g fill="#f7fbfd">
    <rect x="52" y="112" width="66" height="58"/>
    <rect x="176" y="92" width="58" height="78"/>
    <rect x="300" y="120" width="52" height="50"/>
    <rect x="392" y="82" width="74" height="88"/>
    <rect x="530" y="116" width="60" height="54"/>
    <rect x="648" y="96" width="56" height="74"/>
    <rect x="778" y="124" width="50" height="46"/>
    <rect x="880" y="88" width="70" height="82"/>
    <rect x="1024" y="118" width="56" height="52"/>
    <rect x="1120" y="134" width="44" height="36"/>
  </g>
  <g fill="#eaf3f9">
    <rect x="126" y="130" width="42" height="40"/>
    <rect x="242" y="126" width="50" height="44"/>
    <rect x="474" y="132" width="48" height="38"/>
    <rect x="598" y="138" width="42" height="32"/>
    <rect x="712" y="110" width="58" height="60"/>
    <rect x="836" y="130" width="36" height="40"/>
    <rect x="958" y="126" width="58" height="44"/>
  </g>

  <!-- domes -->
  <path d="M52 112a33 20 0 0 1 66 0z" fill="#6aa9d2"/>
  <path d="M300 120a26 16 0 0 1 52 0z" fill="#4d97c7"/>
  <path d="M530 116a30 18 0 0 1 60 0z" fill="#6aa9d2"/>
  <path d="M778 124a25 15 0 0 1 50 0z" fill="#4d97c7"/>
  <path d="M1024 118a28 17 0 0 1 56 0z" fill="#6aa9d2"/>

  <!-- lit windows -->
  <g fill="#f6b31b">
    <rect x="64" y="130" width="12" height="14" rx="2"/><rect x="88" y="130" width="12" height="14" rx="2"/>
    <rect x="188" y="110" width="13" height="15" rx="2"/><rect x="210" y="110" width="13" height="15" rx="2"/>
    <rect x="188" y="140" width="13" height="15" rx="2"/>
    <rect x="404" y="100" width="14" height="16" rx="2"/><rect x="430" y="100" width="14" height="16" rx="2"/>
    <rect x="404" y="132" width="14" height="16" rx="2"/>
    <rect x="544" y="136" width="12" height="14" rx="2"/>
    <rect x="660" y="114" width="13" height="15" rx="2"/><rect x="682" y="114" width="13" height="15" rx="2"/>
    <rect x="724" y="128" width="13" height="15" rx="2"/><rect x="748" y="128" width="13" height="15" rx="2"/>
    <rect x="892" y="106" width="14" height="16" rx="2"/><rect x="918" y="106" width="14" height="16" rx="2"/>
    <rect x="892" y="138" width="14" height="16" rx="2"/>
    <rect x="1038" y="136" width="12" height="14" rx="2"/>
    <rect x="1130" y="146" width="12" height="12" rx="2"/>
    <rect x="254" y="142" width="12" height="14" rx="2"/>
    <rect x="486" y="146" width="12" height="14" rx="2"/>
    <rect x="970" y="142" width="12" height="14" rx="2"/>
  </g>

  <!-- doorways -->
  <path d="M212 170v-22a8 8 0 0 1 16 0v22z" fill="#c75b39"/>
  <path d="M436 170v-24a8 8 0 0 1 16 0v24z" fill="#c75b39"/>
  <path d="M676 170v-20a8 8 0 0 1 16 0v20z" fill="#c75b39"/>
  <path d="M912 170v-22a8 8 0 0 1 16 0v22z" fill="#c75b39"/>

  <!-- sea -->
  <rect y="170" width="1200" height="90" fill="url(#cdWater)"/>
  <rect y="170" width="1200" height="6" fill="#2f7ba8"/>

  <!-- moonlight on the water -->
  <g fill="#f6b31b" opacity=".4">
    <rect x="1000" y="186" width="20" height="4" rx="2"/>
    <rect x="990" y="202" width="40" height="4" rx="2"/>
    <rect x="1002" y="218" width="16" height="4" rx="2"/>
    <rect x="984" y="234" width="52" height="4" rx="2"/>
  </g>

  <!-- boats -->
  <path d="M300 216h56l-9 13h-38z" fill="#eaf3f9"/>
  <path d="M328 212v-28l19 28z" fill="#f6b31b"/>
  <path d="M328 184v32" stroke="#eaf3f9" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M628 234h38l-6 10h-26z" fill="#dbe9f2" opacity=".8"/>
  <path d="M647 231v-18l13 18z" fill="#f6b31b" opacity=".75"/>
</svg>

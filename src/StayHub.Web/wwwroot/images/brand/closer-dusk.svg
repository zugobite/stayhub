<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="The coastal village at dusk, windows lit">
  <title>The village at dusk</title>
  <defs>
    <linearGradient id="cdWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12557f"/>
      <stop offset="1" stop-color="#0a3352"/>
    </linearGradient>
    <radialGradient id="cdMoon">
      <stop offset="0" stop-color="#f6b31b" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#f6b31b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- No background rect: the band's own gradient shows through. -->

  <!-- moon and its halo -->
  <circle cx="330" cy="62" r="54" fill="url(#cdMoon)"/>
  <circle cx="330" cy="62" r="26" fill="#f6b31b"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="46" cy="40" r="2.2" opacity=".85"/>
    <circle cx="104" cy="22" r="1.6" opacity=".6"/>
    <circle cx="168" cy="52" r="2" opacity=".75"/>
    <circle cx="238" cy="28" r="1.5" opacity=".55"/>
    <circle cx="82" cy="86" r="1.5" opacity=".5"/>
    <circle cx="392" cy="118" r="1.8" opacity=".6"/>
    <circle cx="286" cy="96" r="1.4" opacity=".45"/>
  </g>

  <!-- sea -->
  <path d="M0 214h420v70a16 16 0 0 1-16 16H16a16 16 0 0 1-16-16z" fill="url(#cdWater)"/>
  <rect y="214" width="420" height="7" fill="#2f7ba8"/>

  <!-- moon shimmer on the water -->
  <g fill="#f6b31b" opacity=".45">
    <rect x="322" y="226" width="16" height="4" rx="2"/>
    <rect x="316" y="240" width="28" height="4" rx="2"/>
    <rect x="324" y="254" width="13" height="4" rx="2"/>
    <rect x="312" y="268" width="36" height="4" rx="2"/>
  </g>

  <!-- village -->
  <rect x="34" y="152" width="52" height="62" fill="#f7fbfd"/>
  <path d="M34 152a26 16 0 0 1 52 0z" fill="#6aa9d2"/>
  <rect x="94" y="128" width="60" height="86" fill="#eaf3f9"/>
  <rect x="162" y="164" width="48" height="50" fill="#f7fbfd"/>
  <path d="M162 164a24 15 0 0 1 48 0z" fill="#4d97c7"/>
  <rect x="218" y="140" width="66" height="74" fill="#eaf3f9"/>
  <rect x="292" y="172" width="44" height="42" fill="#f7fbfd"/>
  <path d="M292 172a22 14 0 0 1 44 0z" fill="#6aa9d2"/>
  <rect x="344" y="186" width="38" height="28" fill="#eaf3f9"/>

  <!-- lit windows -->
  <g fill="#f6b31b">
    <rect x="46" y="170" width="12" height="14" rx="2"/>
    <rect x="66" y="170" width="12" height="14" rx="2"/>
    <rect x="106" y="146" width="13" height="15" rx="2"/>
    <rect x="130" y="146" width="13" height="15" rx="2"/>
    <rect x="106" y="176" width="13" height="15" rx="2"/>
    <rect x="174" y="182" width="12" height="14" rx="2"/>
    <rect x="232" y="158" width="13" height="15" rx="2"/>
    <rect x="256" y="158" width="13" height="15" rx="2"/>
    <rect x="232" y="188" width="13" height="15" rx="2"/>
    <rect x="304" y="188" width="12" height="14" rx="2"/>
    <rect x="356" y="196" width="12" height="12" rx="2"/>
  </g>

  <!-- doorways -->
  <path d="M130 214v-20a7 7 0 0 1 14 0v20z" fill="#c75b39"/>
  <path d="M262 214v-18a7 7 0 0 1 14 0v18z" fill="#c75b39"/>

  <!-- boat with a lantern -->
  <path d="M150 258h50l-8 12h-34z" fill="#eaf3f9"/>
  <path d="M175 254v-26l18 26z" fill="#f6b31b"/>
  <path d="M175 228v30" stroke="#eaf3f9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="204" cy="252" r="3.4" fill="#f6b31b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Illustration of a host dashboard showing bookings and earnings">
  <defs>
    <linearGradient id="heSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f1f8"/>
      <stop offset="1" stop-color="#fdf3dc"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" rx="16" fill="url(#heSky)"/>
  <circle cx="268" cy="46" r="26" fill="#f6b31b"/>

  <!-- dashboard panel -->
  <rect x="28" y="42" width="196" height="150" rx="12" fill="#ffffff" stroke="#16323f" stroke-width="2.5"/>
  <path d="M28 66h196" stroke="#dbe5ec" stroke-width="2"/>
  <circle cx="43" cy="54" r="3.5" fill="#c75b39"/>
  <circle cx="55" cy="54" r="3.5" fill="#f6b31b"/>
  <circle cx="67" cy="54" r="3.5" fill="#0e6ba8"/>

  <!-- earnings bars -->
  <g fill="#dbe5ec">
    <rect x="46" y="132" width="18" height="36" rx="4"/>
    <rect x="74" y="118" width="18" height="50" rx="4"/>
    <rect x="102" y="126" width="18" height="42" rx="4"/>
  </g>
  <rect x="130" y="100" width="18" height="68" rx="4" fill="#0e6ba8"/>
  <rect x="158" y="86" width="18" height="82" rx="4" fill="#f6b31b"/>
  <path d="M46 168h150" stroke="#dbe5ec" stroke-width="2.5" stroke-linecap="round"/>

  <!-- trend line -->
  <path d="M52 122 82 110l28 8 28-22 30-14" fill="none" stroke="#c75b39" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel heading bars -->
  <rect x="46" y="78" width="64" height="7" rx="3.5" fill="#16323f"/>
  <rect x="46" y="90" width="40" height="6" rx="3" fill="#dbe5ec"/>

  <!-- booking request card -->
  <rect x="176" y="128" width="116" height="72" rx="10" fill="#ffffff" stroke="#16323f" stroke-width="2.5"/>
  <circle cx="198" cy="150" r="11" fill="#f6b31b"/>
  <rect x="216" y="144" width="58" height="6" rx="3" fill="#16323f"/>
  <rect x="216" y="155" width="38" height="5" rx="2.5" fill="#dbe5ec"/>
  <rect x="190" y="172" width="42" height="16" rx="8" fill="#0e6ba8"/>
  <rect x="240" y="172" width="42" height="16" rx="8" fill="#f2f7fa" stroke="#dbe5ec" stroke-width="1.5"/>

  <!-- little whitewashed house, tying back to the listing artwork -->
  <rect x="40" y="196" width="34" height="26" fill="#ffffff" stroke="#16323f" stroke-width="2"/>
  <path d="M38 196a19 12 0 0 1 38 0z" fill="#0e6ba8"/>
  <path d="M52 222v-10a5 5 0 0 1 10 0v10z" fill="#c75b39"/>
</svg>
